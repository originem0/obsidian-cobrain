<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><link rel="stylesheet" href="/styles.css"><title>Cobrain UI verification</title>
<style>
:root { --background-primary:#fcfbf8; --background-primary-alt:#fff; --background-secondary:#f1f0eb; --background-modifier-border:#deded6; --background-modifier-hover:#e7e9e3; --text-normal:#303932; --text-muted:#6e786f; --text-accent:#446954; --interactive-accent:#446954; --font-interface:"Segoe UI","Microsoft YaHei",sans-serif; --font-text:"Segoe UI","Microsoft YaHei",sans-serif; --shadow-s:0 2px 10px #0001; }
body.dark { --background-primary:#222622; --background-secondary:#2c322d; --background-modifier-border:#434b44; --background-modifier-hover:#39453b; --text-normal:#e3e9e1; --text-muted:#a6b3a6; --text-accent:#a8cdb4; --interactive-accent:#668e72; color-scheme:dark; }
html,body { margin:0; padding:0; height:100%; min-width:0; background:var(--background-primary); color:var(--text-normal); font-family:var(--font-interface); font-size:15px; }
#host { height:100vh; height:100dvh; width:100%; }
button,input,textarea,select { font:inherit; color:inherit; border:1px solid var(--background-modifier-border); background:var(--background-primary); border-radius:5px; padding:6px 10px; }
button { cursor:pointer; } button:disabled { opacity:.5; } .mod-cta { background:var(--interactive-accent); color:white; border-color:var(--interactive-accent); }
a { color:var(--text-accent); } .modal-container { position:fixed; inset:0; background:#0006; z-index:100; display:grid; place-items:center; padding:12px; }
.modal { width:min(540px,100%); max-height:90dvh; box-sizing:border-box; overflow:auto; padding:20px; background:var(--background-primary); border-radius:10px; }
.menu { position:fixed; z-index:90; right:12px; top:48px; width:230px; max-height:85vh; overflow:auto; padding:6px; border:1px solid var(--background-modifier-border); border-radius:8px; background:var(--background-primary); box-shadow:var(--shadow-s); }
.menu button,.suggestion-item { display:block; width:100%; text-align:left; border:none; min-height:40px; }
#reader-focus { position:fixed; top:0; left:0; width:1px; height:1px; clip-path:inset(50%); overflow:hidden; padding:0; border:0; }
/* Host layout mirrors Obsidian 1.14.5's settings scroll container and Setting rows. */
.cobrain-settings-test-host { position:fixed; inset:12px; z-index:200; display:flex; flex-direction:column; max-width:900px; margin:auto; overflow:hidden; background:var(--background-primary); border:1px solid var(--background-modifier-border); }
.settings-test-title { padding:12px 20px; flex:0 0 auto; font-weight:600; }
.cobrain-settings-test-host .vertical-tab-content-container { position:relative; overflow:hidden; flex-grow:1; min-height:0; min-width:0; }
.vertical-tab-content { overflow-y:auto; height:100%; padding:24px; box-sizing:border-box; container-type:inline-size; }
.setting-item { display:flex; align-items:flex-start; gap:12px; padding:16px 0; border-bottom:1px solid var(--background-modifier-border); }
.setting-item-info { flex:1 1 auto; min-width:0; }
.setting-item-description { color:var(--text-muted); font-size:0.85em; margin-top:6px; }
.setting-item-control { flex:1 1 auto; text-align:end; display:flex; justify-content:flex-end; align-items:center; gap:8px; }
.constrained-settings .vertical-tab-content { display:flex; flex-direction:column; overflow-y:hidden; }
</style></head><body class="is-mobile"><main id="host"></main><button id="reader-focus">Reading focus test target</button><script type="module" src="/harness.js"></script></body></html>
