name: Release

# 推送形如 0.1.9 的 tag 时触发：构建 → 生成构建溯源签名(attestation) → 发布 GitHub Release。
# 取代本地 `gh release create`：发版只需 bump 版本号、提交、`git tag <ver> && git push origin <ver>`。
on:
  push:
    tags:
      - "*"

permissions:
  contents: write      # 创建 release、上传产物
  id-token: write      # attestation 走 OIDC
  attestations: write  # 写构建溯源签名

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check plugin requirements
        run: npm run check:plugin

      # 与社区目录自动审核同一套规则：错误或新增警告都会阻止发版，避免发布后被移出搜索。
      - name: Lint with the directory review rules
        run: npm run lint

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match manifest version $MANIFEST"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

      - name: Package plugin
        run: zip "cobrain-${GITHUB_REF_NAME}.zip" main.js manifest.json styles.css

      # 给发布产物生成构建溯源签名：用户可用 `gh attestation verify` 验证产物确由本仓库源码构建。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            cobrain-${{ github.ref_name }}.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=(--generate-notes)
          if [ -f "docs/${GITHUB_REF_NAME}-change-notes.md" ]; then
            NOTES=(--notes-file "docs/${GITHUB_REF_NAME}-change-notes.md")
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            "${NOTES[@]}" \
            main.js manifest.json styles.css "cobrain-${GITHUB_REF_NAME}.zip"
