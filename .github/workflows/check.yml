name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check plugin requirements
        run: npm run check:plugin
      - name: Lint with the directory review rules
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --runInBand
